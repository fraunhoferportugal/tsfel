[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tsfel"
version = "0.3.0"
description = "Time Series Feature Extraction Library (TSFEL): 60+ statistical, temporal, spectral and fractal features for time series classification, regression and signal processing in Python"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [{ name = "Fraunhofer Portugal" }]
keywords = [
    "time series",
    "time-series",
    "feature extraction",
    "feature engineering",
    "time series classification",
    "time-series-analysis",
    "time-series-classification",
    "time-series-regression",
    "data-science",
    "scikit-learn",
    "signal processing",
    "biosignals",
    "physiological signals",
    "wearables",
    "sensors",
    "human activity recognition",
    "ECG",
    "EEG",
    "EMG",
    "audio",
    "accelerometer",
    "spectral features",
    "wavelets",
    "fractal",
    "machine learning",
    "explainable AI",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Floors: oldest releases with wheels for the oldest supported Python, tested in CI.
# No upper bounds, so TSFEL can be installed alongside other scientific stacks.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11.2",
    "pandas>=2.1.1",
    "scikit-learn>=1.3.1",
    "PyWavelets>=1.9",  # 1.9+ gives identical wavelet features on NumPy 1.x and 2.x
    "statsmodels>=0.14",
    "requests>=2.32.4",  # dataset loaders; floor kept for security fixes
    "ipython>=8.0",  # remove once the IPython import is made lazy
]

[project.optional-dependencies]
# An extra (not a dependency group) because Read the Docs installs it with `.[docs]`
docs = [
    "numpydoc>=1.7,<2",
    "pydata-sphinx-theme>=0.16,<0.19",
    "sphinx>=7.2.6,<9",
    "sphinx-copybutton>=0.5,<0.6",
    "sphinx-design>=0.6,<0.7",
]

[project.urls]
Homepage = "https://github.com/fraunhoferportugal/tsfel"
Documentation = "https://tsfel.readthedocs.io"
Source = "https://github.com/fraunhoferportugal/tsfel"
Issues = "https://github.com/fraunhoferportugal/tsfel/issues"
Changelog = "https://github.com/fraunhoferportugal/tsfel/blob/master/CHANGELOG.rst"
Paper = "https://doi.org/10.1016/j.softx.2020.100456"

# Development-only dependencies: not published to PyPI.
#   pip install -e . --group dev     (pip >= 25.1)
#   pip install .    --group test    (CI)
[dependency-groups]
test = [
    "pytest>=8",
    "colorednoise>=2.2",
]
dev = [
    { include-group = "test" },
    "ipython>=9.0",
    "ipykernel>=7.0",  # run the notebooks in VS Code, PyCharm or JupyterLab
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "pre-commit>=4.0",
]

[tool.setuptools.packages.find]
include = ["tsfel*"]

[tool.setuptools.package-data]
tsfel = ["feature_extraction/features.json"]

# --- Testing ----------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-vv", "-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
xfail_strict = true
log_level = "INFO"
markers = ["network: tests that download data from the internet"]

[tool.coverage.run]
source = ["tsfel"]

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true

# --- Linting and formatting (run through pre-commit) ------------------------

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade
    "I",        # isort
    "PGH",      # pygrep-hooks (blanket noqa, type comments)
    "T10",      # debugger statements
    "RUF100",   # unused noqa comments
]
ignore = [
    "E501",     # line length: the formatter handles code; long strings/URLs are fine
    "E741",     # short names like `l` are common in signal-processing code
    "B008",     # function calls in argument defaults
    "B028",     # warnings.warn without stacklevel
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # re-exports via star imports
# Star imports to be replaced by explicit imports (known technical debt):
"tsfel/feature_extraction/features.py" = ["F403", "F405"]
"tests/test_features.py" = ["F403", "F405"]
"notebooks/*" = ["E402"]  # imports placed where they are first explained

[tool.ruff.lint.isort]
known-first-party = ["tsfel"]

[tool.codespell]
skip = "*.ipynb,*.json,*.csv,docs/_build"

[tool.numpydoc_validation]
# Only check that docstrings match the function signatures
checks = ["PR01", "PR02", "RT01"]
