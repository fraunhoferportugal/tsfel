# Pre-commit hooks for TSFEL
#
#   pre-commit install                 # once per clone: run the hooks on every commit
#   pre-commit run --all-files         # run every hook on the whole repository
#   pre-commit run --hook-stage manual --all-files   # also run hooks that aren't enforced yet
#   pre-commit autoupdate              # bump hook versions (pre-commit.ci does this monthly)
#
# Policy for hooks that don't work:
#   - Don't comment them out. Remove the hook and say why in the commit message,
#     so the history keeps the reason and the file stays readable.
#   - A hook we want but can't enforce yet (e.g. existing code fails it) gets
#     `stages: [manual]`: it still runs on demand, but doesn't block commits.
#   - A hook that misfires on specific files gets an `exclude:` pattern, not removal.

ci:
  autoupdate_schedule: monthly
  autofix_commit_msg: "style: apply pre-commit fixes"
  autoupdate_commit_msg: "build: update pre-commit hooks"

repos:
  # --- Generic file hygiene -------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024", "--enforce-all"]
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: no-commit-to-branch
        args: ["--branch", "master"]
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]

  # --- Python: lint, format, import sorting, syntax upgrades (code and notebooks) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: ["--fix", "--show-fixes"]
      - id: ruff-format

  # --- reStructuredText (docs/ and CHANGELOG.rst) --------------------------
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  # --- Docstrings match the function signatures (replaces darglint) ---------
  - repo: https://github.com/numpy/numpydoc
    rev: v1.11.0
    hooks:
      - id: numpydoc-validation
        files: ^tsfel/
        stages: [manual] # enforce once the existing mismatches are fixed

  # --- Spelling in code, docstrings and docs ---------------------------------
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  # --- Notebooks: keep outputs and editor metadata out of git --------------
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
        args:
          - --extra-keys
          - "metadata.colab metadata.kernelspec cell.metadata.colab cell.metadata.executionInfo cell.metadata.id cell.metadata.outputId"

  # --- Configuration files ---------------------------------------------------
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
      - id: check-readthedocs

  # --- GitHub Actions security (supply-chain checks on the CI workflows) ----
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        stages: [manual] # enforce when the CI workflow is reworked
